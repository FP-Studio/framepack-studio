[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradio_timeline"
version = "0.1.0"
description = "Section timeline component for FramePack Studio"
requires-python = ">=3.10"
keywords = ["gradio-custom-component"]
dependencies = ["gradio>=5.25,<6.0"]

[tool.hatch.build]
artifacts = ["/backend/gradio_timeline/templates", "*.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["/backend/gradio_timeline"]
